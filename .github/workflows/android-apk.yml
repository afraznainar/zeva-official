name: Android APK

# Builds the Zeva order app APK in the cloud — no Android SDK is needed on the
# counter laptop. Run it from the Actions tab (or push a v* tag) and download
# "zeva-app-debug.apk" from the run's Artifacts section.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: apk
        run: npx cap add android

      - name: Sync the shell config
        working-directory: apk
        run: npx cap sync android

      # cap add regenerates android/ from the template, so the zeva://auth intent
      # filter (Google sign-in hand-back) and the version numbers are re-applied here.
      - name: Patch the Android project
        working-directory: apk
        run: node patch-android.mjs

      - name: Build the debug APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: zeva-app-debug-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
